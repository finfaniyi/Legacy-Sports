<section class="hero">

  <h1>Registration</h1>

  <p class="subtitle">
    Register your team for the Legacy Sports Volleyball Tournament.
  </p>

  <div class="registration-countdown live">

    <h2>Closes In</h2>

    <div
      id="countdown"
      data-date="{{ registration_close|date:'c' }}"
    ></div>

  </div>

  <div class="registration-main-cta">

    <a
      href="{% url 'registration_team' %}"
      class="main-registration-btn"
    >
      REGISTER YOUR TEAM
    </a>

    <p class="spots-text">
      Limited team spots available
    </p>

  </div>

  <div class="registration-actions">

    <a
      href="{% url 'free_agent_signup' %}"
      class="reg-btn primary"
    >
      Join as Free Agent
    </a>

    <a
      href="{% url 'free_agent_pool' %}"
      class="reg-btn secondary"
    >
      Find Teammates
    </a>

  </div>

</section>
